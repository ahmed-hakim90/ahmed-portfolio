# Appends CHANGELOG_PUSHES.md on each push (human-readable CHANGELOG.md is updated manually or in PRs).
name: Changelog push log

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: changelog-log-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip changelog]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append push entry
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/append-push-changelog.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG_PUSHES.md
          if git diff --staged --quiet; then
            echo "No changelog push log changes."
            exit 0
          fi
          git commit -m "chore(changelog): append push log [skip changelog]"
          git push
